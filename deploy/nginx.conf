# 在 HTTP 配置层按实际 TLS 连接决定 HSTS，不扩展到其他子域。
map $scheme $samsblog_strict_transport_security {
    default "";
    https "max-age=31536000";
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;
    client_max_body_size 11m;
    access_log off;

    # 页面、接口和错误响应共用代理层安全头，避免与上游重复。
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security $samsblog_strict_transport_security always;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Geo-Country "";
        proxy_set_header X-Geo-Region "";
        proxy_set_header X-Geo-City "";
    }

    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 此处已有 add_header，需显式保留上层安全头。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security $samsblog_strict_transport_security always;
    }
}
